# Full Dockerized Kafka Pipeline v2
# Resource constraint: 2GB total memory, 4 cores total
#
# Usage:
#   docker compose up kafka -d          # Start Kafka
#   docker compose run pipeline 1000    # Run with 1000 records (smoke test)
#   docker compose run pipeline         # Run with 50M records (full)
#   docker exec kafka-v2 /opt/kafka/bin/kafka-console-consumer.sh \
#     --bootstrap-server localhost:9092 --topic continent --from-beginning --max-messages 20
#
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-v2
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-v2:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-v2:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_SEGMENT_BYTES: "67108864"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_REQUEST_TIMEOUT_MS: "60000"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "640MB"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  pipeline:
    image: srirammohankoushik2127/kafka-pipeline-v2:latest
    # build: .    # Uncomment to build from source instead of pulling from DockerHub
    container_name: pipeline-v2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka-v2:9092
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: "1280MB"
    volumes:
      - ./data:/app/data

volumes: {}
